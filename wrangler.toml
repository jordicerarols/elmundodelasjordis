name = "jordis"
main = "src/index.ts"
compatibility_date = "2024-09-23"
account_id = "87f407717f9c49b03c1642607919d7ce"

# Dominio en producción: el Worker sirve el apex y www como custom domains.
# (Cutover ejecutado el 7 jul 2026; DNS previo de GitHub Pages respaldado.)
routes = [
  { pattern = "elmundodelasjordis.com", custom_domain = true },
  { pattern = "www.elmundodelasjordis.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "jordis-db"
database_id = "d60120ab-6789-4d5b-8c89-fc681e98d0fa"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "jordis-storage"

# Rate limiting nativo de Workers (sin KV ni recurso externo). Protege las
# escrituras authed (crear posts, subir media, CRUD de jordis) frente a un
# bucle accidental que sature R2/D1. namespace_id es un id lógico que eliges
# tú; period sólo admite 10 o 60 (segundos).
[[unsafe.bindings]]
name = "WRITE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 100, period = 60 }
