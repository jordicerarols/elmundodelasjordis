name: deploy

# Despliega el Worker a Cloudflare en cada push a main.
# Requiere el secret de repositorio CLOUDFLARE_API_TOKEN (ver README).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Permisos mínimos: solo leer el contenido del repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x exige Node >= 22.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy a Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          # OJO: sin esto, wrangler-action usa su wrangler embebido (3.90.0),
          # que NO entiende `assets.run_worker_first` y lo descarta con un
          # warning → producción servía los assets SIN pasar por el worker
          # (sin COOP/COEP → sin compresor de vídeo; /escribir y /editar sin
          # auth; 405 en POST a rutas con asset homónimo). Mantener en línea
          # con la versión de package-lock.json.
          wranglerVersion: "4.107.0"
