<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>entrar — las jordis</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <h1>las jordis</h1>
    <form method="post" action="/login" style="display:flex;flex-direction:column;gap:14px;width:100%">
      <input
        type="password"
        name="password"
        placeholder="contraseña"
        autofocus
        required
        autocomplete="current-password"
      />
      <button type="submit">entrar</button>
    </form>
    <a class="btn-secondary" href="/">volver</a>
    <p id="err" class="login-err"></p>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('e')) {
      document.getElementById('err').textContent = 'contraseña incorrecta';
    }
  </script>
</body>
</html>
