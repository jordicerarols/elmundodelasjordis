<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>el mundo de las jordis</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="welcome-body">
  <div class="welcome-grid">
    <div class="welcome-left">
      <div class="welcome-top">
        <h1 class="site-title"><span class="site-title-line">el mundo de</span> <a class="h1-link site-title-line" href="/las-jordis">las jordis</a></h1>
        <nav class="welcome-actions" aria-label="acciones">
          <a class="linky" href="/escribir" data-authed-only hidden>escribir</a>
          <a class="linky" href="/editar" data-authed-only hidden>editar las jordis</a>
          <a class="linky" href="/login" data-anon-only>entrar</a>
          <!-- Sin style inline: un display explícito ganaría al atributo hidden
               y "salir" se vería también sin login. Como .welcome-actions es
               flex, el form ya se comporta como item inline. -->
          <form method="post" action="/api/logout" data-authed-only hidden>
            <button class="linky" type="submit">salir</button>
          </form>
        </nav>
      </div>
      <ul class="hashtag-list" id="hashtagList" aria-label="filtrar por hashtag"></ul>
    </div>
    <main class="welcome-right">
      <div class="feed" id="feed"></div>
      <div class="feed-sentinel" id="sentinel"></div>
    </main>
  </div>
  <script type="module" src="/js/page-welcome.js"></script>
</body>
</html>
